<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Senate Portal</title>
    <script src="auth.js"></script>
    <style>
        :root {
            --glow-color: #00ffff; /* Cyan glow */
            --primary-text: #e0e0e0;
            --background-color: #0a0a14;
            --container-bg: rgba(10, 25, 47, 0.8);
            --border-color: rgba(0, 255, 255, 0.3);
            --error-color: #ff4d4d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(0, 255, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(0, 100, 255, 0.1) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--primary-text);
        }
        .login-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 2.5em;
            color: #fff;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #fff, 0 0 15px #fff, 0 0 25px var(--glow-color), 0 0 35px var(--glow-color);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--glow-color);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box; /* Important for padding and width */
            font-size: 1em;
            color: var(--primary-text);
        }
        input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--glow-color);
            box-shadow: 0 0 10px var(--glow-color);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            border: 2px solid var(--glow-color);
            color: white;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            text-shadow: 0 0 5px var(--glow-color);
            margin-top: 10px;
        }
        button:hover {
            background-color: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--glow-color);
        }
        .error-message {
            color: var(--error-color);
            text-shadow: 0 0 8px var(--error-color);
            margin-top: 15px;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Senate Portal</h1>
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button onclick="login()">Login</button>
        <p id="login-error" class="error-message">Invalid credentials. Please try again.</p>
    </div>
</body>
</html>
