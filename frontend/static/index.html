<!DOCTYPE html>
<html> <!-- Removed lang attribute to let browser use its absolute default -->
<head>
    <meta charset="UTF-8">
    <title>Enterprise Chat</title>
    <script src="auth.js"></script>
    <script src="chat.js"></script>
</head>
<body>
    <div id="auth-controls">
        <div id="user-profile-icon">👤</div>
        <button id="login-logout-button"></button>
    </div>

    <!-- The User Profile Modal -->
    <div id="user-profile-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>User Profile</h2>
            <p><strong>Name:</strong> <span id="modal-user-name"></span></p>
            <p><strong>Role:</strong> <span id="modal-user-role"></span></p>
            <p><strong>Office:</strong> <span id="modal-user-office"></span></p>
        </div>
    </div>

    <h1 id="welcome-header">Welcome to the Chat Assistant</h1>
    <div class="chat-input-container">
        <!-- Speech Recognition Toggle -->
        <label class="switch">
            <input type="checkbox" id="mic-toggle">
            <span class="slider"></span>
        </label>
        <textarea id="chatbox" placeholder="Enter your request or question..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
    <div id="chat-container" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px;">
        <!-- Chat messages will appear here -->
    </div>
    <!-- Toast Notification element for displaying errors -->
    <div id="toast-notification" class="toast"></div>

    <style>
        #auth-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #user-profile-icon {
            display: none; /* Hidden by default, shown via JS */
            cursor: pointer;
            font-size: 24px;
        }
        .chat-input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        #chatbox {
            flex-grow: 1; /* Take up remaining space */
            resize: vertical;
            min-height: 40px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        /* The switch - a checkbox with a custom style */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { display: none; } /* Hide default checkbox */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "🎤";
            height: 20px; width: 20px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 2; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 8px;
            position: relative;
        }
        .close-button {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        /* Toast Notification styles */
        .toast {
            visibility: hidden; /* Hidden by default */
            min-width: 250px;
            background-color: #d9534f; /* Red for error */
            color: white;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px; /* 30px from the bottom */
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }

        .chat-turn {
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fdfdfd;
        }
        .chat-turn > div:first-child {
            margin-bottom: 12px; /* Space between user message and bot reply */
        }

        .bot-reply {
            color: blue;
        }
        .json-response {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap; /* Ensures long lines wrap */
            word-wrap: break-word; /* Breaks long words/strings */
        }
    </style>
</body>
</html>
