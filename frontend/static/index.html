<!DOCTYPE html>
<html> <!-- Removed lang attribute to let browser use its absolute default -->
<head>
    <meta charset="UTF-8">
    <title>Enterprise Chat</title>
    <script src="auth.js"></script>
    <script src="chat.js"></script>
</head>
<body>
    <div id="auth-controls">
        <div id="user-profile-icon">👤</div>
        <button id="login-logout-button"></button>
    </div>

    <!-- The User Profile Modal -->
    <div id="user-profile-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>User Profile</h2>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body">
                <p><strong>Name:</strong> <span id="modal-user-name"></span></p>
                <p><strong>Role:</strong> <span id="modal-user-role"></span></p>
                <p><strong>Office:</strong> <span id="modal-user-office"></span></p>
            </div>
        </div>
    </div>
 
    <div class="main-container">
        <h1 id="portal-header">Senate Portal</h1>

        <!-- Main Chat Interface -->
        <div id="chat-interface">
            <div id="chat-container">
                <!-- Chat messages will appear here -->
            </div>
            <div class="chat-input-container">
                <textarea id="chatbox" placeholder="Enter your request..."></textarea>
                <button id="send-button" onclick="sendMessage()">
                    <div class="orb"></div>
                </button>
            </div>
        </div>
    </div>


    <!-- Toast Notification element for displaying errors -->
    <div id="toast-notification" class="toast"></div>

    <style>
        /* --- Basic Setup & Futuristic Theme --- */
        :root {
            --glow-color: #00ffff; /* Cyan glow */
            --primary-text: #e0e0e0;
            --secondary-text: #a0a0a0;
            --background-color: #0a0a14;
            --container-bg: rgba(10, 25, 47, 0.8);
            --border-color: rgba(0, 255, 255, 0.3);
        }

        body {
            background-color: var(--background-color);
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(0, 255, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(0, 100, 255, 0.1) 0%, transparent 40%);
            color: var(--primary-text);
            font-family: 'Orbitron', sans-serif; /* A futuristic font, needs to be imported or use a fallback */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Changed from overflow: hidden to allow scrolling on smaller screens */
            padding-bottom: 20px; /* Add padding at the bottom */
            box-sizing: border-box;
        }

        /* --- Auth & Header --- */
        #auth-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        #user-profile-icon {
            display: none; /* Hidden by default, shown via JS */
            cursor: pointer;
            font-size: 32px; /* Increased font size */
            color: var(--glow-color);
            text-shadow: 0 0 5px var(--glow-color);
        }
        #login-logout-button {
            background-color: transparent;
            border: 1px solid var(--glow-color);
            color: var(--glow-color);
            padding: 10px 18px; /* Increased padding */
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em; /* Increased font size */
            transition: background-color 0.3s, box-shadow 0.3s;
            text-shadow: 0 0 3px var(--glow-color);
        }
        #login-logout-button:hover {
            background-color: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 10px var(--glow-color);
        }
        #portal-header {
            font-family: "Times New Roman", Times, serif; /* Keep original font for branding */
            font-size: 3em; /* Adjusted for better balance */
            color: #fff;
            margin-bottom: 15px; /* Adjusted margin */
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 600;
            text-shadow: 0 0 5px #fff, 0 0 15px #fff, 0 0 25px var(--glow-color), 0 0 35px var(--glow-color);
        }

        /* --- Modal Styles (Dark Theme) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--container-bg);
            margin: 15% auto;
            padding: 0;
            border: 1px solid var(--glow-color);
            width: 80%;
            max-width: 450px;
            border-radius: 15px;
            box-shadow: 0 0 25px var(--glow-color);
            overflow: hidden;
        }
        .modal-header {
            background-color: transparent;
            border-bottom: 1px solid var(--glow-color);
            color: var(--glow-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 1.5em; /* Increased font size */
            text-shadow: 0 0 5px var(--glow-color);
        }
        .modal-body {
            padding: 25px;
        }
        .modal-body p {
            margin: 15px 0;
            font-size: 1.3em; /* Increased font size */
            line-height: 1.5;
            color: var(--primary-text);
        }
        .modal-body p strong {
            color: var(--glow-color);
            min-width: 80px;
            display: inline-block;
        }
        .close-button {
            color: #f1f1f1;
            font-size: 32px; /* Increased font size */
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .close-button:hover,
        .close-button:focus {
            color: var(--glow-color);
            text-shadow: 0 0 10px var(--glow-color);
        }

        /* --- Main Chat Interface --- */
        .main-container {
            width: 100%;
            max-width: 900px; /* Expanded for more space */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #chat-interface {
            width: 100%;
            height: 80vh; /* Increased height to fill more space */
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        #chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        /* Custom scrollbar for futuristic look */
        #chat-container::-webkit-scrollbar {
            width: 8px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background-color: var(--glow-color);
            border-radius: 4px;
            border: 2px solid transparent;
        }

        /* --- Glowing Orb Button --- */
        #send-button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orb {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #fff, var(--glow-color));
            border-radius: 50%;
            box-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--glow-color),
                0 0 30px var(--glow-color);
            transition: all 0.3s ease-in-out;
            animation: pulse 2s infinite;
        }
        #send-button:hover .orb {
            transform: scale(1.1);
            box-shadow: 
                0 0 8px #fff,
                0 0 15px #fff,
                0 0 30px var(--glow-color),
                0 0 45px var(--glow-color);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--glow-color), 0 0 30px var(--glow-color); }
            50% { box-shadow: 0 0 8px #fff, 0 0 15px #fff, 0 0 30px var(--glow-color), 0 0 45px var(--glow-color); }
            100% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--glow-color), 0 0 30px var(--glow-color); }
        }
        .chat-input-container {
            display: flex;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            gap: 15px;
            align-items: center;
        }
        #chatbox {
            flex-grow: 1;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            resize: none;
            color: var(--primary-text);
            font-size: 1.3em; /* Increased font size for readability */
            font-family: inherit;
        }
        #chatbox:focus {
            outline: none;
            box-shadow: 0 0 10px var(--glow-color);
            border-color: var(--glow-color);
        }
        #chatbox::placeholder {
            /* Doubles the font-size of the input text (1.3em * 2) */
            font-size: 1.5em; 
            color: var(--secondary-text);
        }

        /* --- Toast Notification (Dark Theme) --- */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #d9534f; /* Red for error */
            color: white;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 1002;
            left: 50%;
            transform: translateX(-50%);
            bottom: 30px;
            opacity: 0;
            transition: opacity 0.5s, visibility 0.5s;
            box-shadow: 0 0 15px #d9534f;
        }
        .toast.show {
            visibility: visible;
            opacity: 1;
        }

        .chat-turn {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            border-left: 3px solid transparent;
            font-size: 1.3em; /* Increased font size for conversation text */
        }
        .chat-turn > div:first-child {
            margin-bottom: 8px;
            color: var(--primary-text);
        }
        .chat-turn > div:first-child strong {
            color: var(--glow-color);
        }
        .bot-reply {
            color: var(--primary-text);
        }
        .bot-reply strong {
            color: #ffab00; /* A contrasting color for the bot name */
        }
        .json-response {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #f0f0f0;
            margin-top: 10px;
        }

        /* --- Media Queries for Mobile Friendliness --- */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                overflow-y: auto; /* Allow scrolling on mobile */
            }
            .main-container {
                width: 100%;
                padding: 0;
            }
            #portal-header {
                font-size: 2em; /* Reduced header size on mobile */
                letter-spacing: 3px;
                margin-bottom: 10px;
            }
            #chat-interface {
                height: 85vh; /* Take up more vertical space on mobile */
                border-radius: 10px;
            }
        }
    </style>
</body>
</html>
